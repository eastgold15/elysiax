<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elysiax · 关于</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0/dist/htmx.min.js"></script>
  </head>
  <body>
    <nav>
      <a href="/">首页</a> ·
      关于
    </nav>

    <h1>关于</h1>
    <p>
      第二个静态页面。同样在 <code>pages.ts</code> 里收集,由 Bun 打包返回。
    </p>

    <section>
      <h2>再演示一个 htmx 片段</h2>
      <button
        class="btn btn-green"
        hx-get="/random"
        hx-target="#rnd"
        hx-swap="innerHTML"
      >
        随机数
      </button>
      <div id="rnd" class="output"></div>
    </section>

    <script type="module" src="./frontend.ts"></script>
  </body>
</html>
