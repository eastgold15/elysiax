<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elysiax · 首页</title>
    <!-- Bun 打包 HTML 时,会把引用的 css 一起编译打包 -->
    <link rel="stylesheet" href="./styles.css" />
    <!-- htmx 4.0 -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0/dist/htmx.min.js"></script>
  </head>
  <body>
    <nav>
      <a href="/">首页</a> ·
      <a href="/about">关于</a>
    </nav>

    <h1>Elysia 只写后端 🎉</h1>
    <p>
      这个页面是独立的 <code>index.html</code>,由 Bun 的
      HTML import 打包返回,Elysia 里只有一个 <code>return</code>。
    </p>

    <section>
      <h2>htmx 演示</h2>
      <button
        class="btn"
        hx-get="/time"
        hx-target="#clock"
        hx-swap="innerHTML"
      >
        刷新时间
      </button>
      <div id="clock" class="output">还没请求</div>
    </section>

    <!-- Bun 会把引用的 .ts 一起编译成浏览器能跑的 JS -->
    <script type="module" src="./frontend.ts"></script>
  </body>
</html>
